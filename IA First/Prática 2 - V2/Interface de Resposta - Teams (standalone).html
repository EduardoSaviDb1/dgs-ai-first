document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 11px 15px; font-size: 14px; line-height: 1.5;\">Qual o valor do seguro de carga?<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; gap: 12px; align-items: flex-start; max-width: 780px;\">\n          <div style=\"width: 34px; height: 34px; flex: 0 0 34px; border-radius: 50%; background: #5b5fc7; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;\">N<\u002Fdiv>\n          <div style=\"flex: 1; min-width: 0;\">\n            <div style=\"display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px;\"><span style=\"font-size: 13.5px; font-weight: 700;\">NovaTech Assistant<\u002Fspan><span style=\"font-size: 11px; color: #9a9aa4;\">09:43<\u002Fspan><\u002Fdiv>\n            <div style=\"border: 1px solid #e6e5ec; border-radius: 3px 8px 8px 8px; padding: 14px 16px; font-size: 14px; line-height: 1.6; background: #fafafb;\">\n              <div style=\"display: flex; gap: 9px; align-items: flex-start; margin-bottom: 10px;\">\n                <div style=\"width: 20px; height: 20px; flex: 0 0 20px; margin-top: 1px;\"><svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\"><circle cx=\"12\" cy=\"12\" r=\"9.5\" fill=\"none\" stroke=\"#8a8a94\" stroke-width=\"2\"><\u002Fcircle><line x1=\"12\" y1=\"11\" x2=\"12\" y2=\"16.5\" stroke=\"#8a8a94\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fline><circle cx=\"12\" cy=\"7.5\" r=\"1.2\" fill=\"#8a8a94\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n                <p style=\"margin: 0; font-weight: 600;\">Não encontrei resposta para essa pergunta na documentação disponível.<\u002Fp>\n              <\u002Fdiv>\n              <p style=\"margin: 0 0 12px; color: #4a4a54; font-size: 13.5px;\">Não há normativo formal sobre seguro de carga na base atual. Para não correr risco de informar um valor incorreto ao cliente, recomendo o encaminhamento abaixo.<\u002Fp>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center;\">\n                <span style=\"display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; background: #e7f5ec; color: #1a7a43; border: 1px solid #cdeeda; border-radius: 20px; padding: 4px 11px; font-weight: 600;\">→ Encaminhamento sugerido: Comercial<\u002Fspan>\n                <span style=\"display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: #8a8a94; border: 1px solid #e6e5ec; border-radius: 20px; padding: 4px 11px;\">Gap documentado · GAP-03<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 4px; margin-top: 6px;\">\n              <button style=\"border: none; background: transparent; color: #616168; font-size: 12px; display: flex; align-items: center; gap: 5px; padding: 5px 9px; border-radius: 6px; cursor: pointer; font-family: inherit;\" style-hover=\"background:#f2f1f7\">👍 Útil<\u002Fbutton>\n              <button onclick=\"{{ openReportC }}\" style=\"border: none; background: transparent; color: #616168; font-size: 12px; display: flex; align-items: center; gap: 5px; padding: 5px 9px; border-radius: 6px; cursor: pointer; font-family: inherit;\" style-hover=\"background:#f2f1f7\">⚑ Reportar problema<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ============ Q4: intermediate confidence ============ -->\n        <div style=\"display: flex; justify-content: flex-end;\">\n          <div style=\"max-width: 540px;\">\n            <div style=\"font-size: 11px; color: #9a9aa4; text-align: right; margin-bottom: 4px;\">Ana Ribeiro · 09:45<\u002Fdiv>\n            <div style=\"background: #e8ebfa; color: #242424; border-radius: 8px 8px 2px 8px; padding: 11px 15px; font-size: 14px; line-height: 1.5;\">Posso cobrar frete pela devolução de pallets vazios?<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; gap: 12px; align-items: flex-start; max-width: 780px;\">\n          <div style=\"width: 34px; height: 34px; flex: 0 0 34px; border-radius: 50%; background: #5b5fc7; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;\">N<\u002Fdiv>\n          <div style=\"flex: 1; min-width: 0;\">\n            <div style=\"display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px;\"><span style=\"font-size: 13.5px; font-weight: 700;\">NovaTech Assistant<\u002Fspan><span style=\"font-size: 11px; color: #9a9aa4;\">09:45<\u002Fspan><\u002Fdiv>\n            <div style=\"border: 1px solid #e6e5ec; border-radius: 3px 8px 8px 8px; padding: 0; font-size: 14px; line-height: 1.6; background: #fff; overflow: hidden; box-shadow: 0 1px 2px rgba(30,28,50,0.05);\">\n              <div style=\"display: flex; gap: 9px; align-items: flex-start; background: #eef5ff; border-bottom: 1px solid #d5e5fb; padding: 10px 14px;\">\n                <div style=\"width: 18px; height: 18px; flex: 0 0 18px; margin-top: 1px;\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\"><circle cx=\"12\" cy=\"12\" r=\"9.5\" fill=\"none\" stroke=\"#2a6fb0\" stroke-width=\"2\"><\u002Fcircle><line x1=\"12\" y1=\"11\" x2=\"12\" y2=\"16.5\" stroke=\"#2a6fb0\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fline><circle cx=\"12\" cy=\"7.5\" r=\"1.2\" fill=\"#2a6fb0\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n                <span style=\"font-size: 12.5px; color: #1c4f8a; line-height: 1.5;\"><strong>Confiança intermediária.<\u002Fstrong> Resposta gerada a partir de documentação parcialmente relacionada. Confirme com o responsável antes de informar ao cliente.<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"padding: 13px 16px 14px;\">\n                <p style=\"margin: 0 0 10px;\">A base trata devoluções de mercadoria via <strong>coleta reversa<\u002Fstrong> (POL-001), mas não há regra específica para <strong>pallets vazios<\u002Fstrong> como item de devolução. O procedimento de coleta reversa pode não se aplicar integralmente a este caso.<\u002Fp>\n                <div style=\"display: flex; flex-wrap: wrap; gap: 6px; align-items: center;\">\n                  <span style=\"font-size: 11px; color: #8a8a94; margin-right: 2px;\">Relacionado:<\u002Fspan>\n                  <span style=\"font-size: 11.5px; background: #eef0fb; color: #4b4fbf; border: 1px solid #dcdefa; border-radius: 20px; padding: 3px 10px;\">POL-001 · seção 3<\u002Fspan>\n                  <span style=\"font-size: 11.5px; color: #8a8a94; border: 1px solid #e6e5ec; border-radius: 20px; padding: 3px 10px;\">score 0.78<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 4px; margin-top: 6px;\">\n              <button style=\"border: none; background: transparent; color: #616168; font-size: 12px; display: flex; align-items: center; gap: 5px; padding: 5px 9px; border-radius: 6px; cursor: pointer; font-family: inherit;\" style-hover=\"background:#f2f1f7\">👍 Útil<\u002Fbutton>\n              <button onclick=\"{{ openReportD }}\" style=\"border: none; background: transparent; color: #616168; font-size: 12px; display: flex; align-items: center; gap: 5px; padding: 5px 9px; border-radius: 6px; cursor: pointer; font-family: inherit;\" style-hover=\"background:#f2f1f7\">⚑ Reportar problema<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n\n      <!-- composer -->\n      <div style=\"flex: 0 0 auto; border-top: 1px solid #edecf2; padding: 14px 24px 18px;\">\n        <div style=\"border: 1px solid #d6d5e0; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px;\">\n          <div style=\"font-size: 14px; color: #9a9aa4;\">Faça uma pergunta ao assistente…<\u002Fdiv>\n          <div style=\"display: flex; align-items: center; justify-content: space-between;\">\n            <div style=\"display: flex; gap: 14px; color: #9a9aa4; font-size: 16px;\"><span>📎<\u002Fspan><span>😀<\u002Fspan><span>＋<\u002Fspan><\u002Fdiv>\n            <div style=\"width: 34px; height: 34px; border-radius: 8px; background: #5b5fc7; display: flex; align-items: center; justify-content: center;\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\"><path d=\"M3 11 L21 3 L14 21 L11 13 Z\" fill=\"#fff\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size: 11px; color: #9a9aa4; margin-top: 8px; text-align: center;\">O assistente responde apenas com base na documentação normativa indexada · respostas com fonte citada<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ Feedback dialog ============ -->\n  <sc-if value=\"{{ reportOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: absolute; inset: 0; background: rgba(37,36,54,0.42); display: flex; align-items: center; justify-content: center; z-index: 50;\">\n      <div style=\"width: 480px; background: #fff; border-radius: 12px; box-shadow: 0 30px 80px rgba(20,18,40,0.4); overflow: hidden;\">\n\n        <sc-if value=\"{{ reportNotSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n        <div>\n          <div style=\"padding: 20px 22px 14px; border-bottom: 1px solid #edecf2;\">\n            <div style=\"display: flex; justify-content: space-between; align-items: flex-start;\">\n              <div style=\"font-size: 16px; font-weight: 700;\">Reportar problema na resposta<\u002Fdiv>\n              <button onclick=\"{{ closeReport }}\" style=\"border: none; background: transparent; font-size: 20px; color: #8a8a94; cursor: pointer; line-height: 1; padding: 0;\">×<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"font-size: 12.5px; color: #616168; margin-top: 6px;\">Sobre a pergunta: <span style=\"color: #242424;\">“{{ reportQuery }}”<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 18px 22px;\">\n            <div style=\"font-size: 12.5px; font-weight: 700; color: #616168; margin-bottom: 10px;\">Qual é o problema?<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n\n              <div onclick=\"{{ pickType }}\" data-value=\"Resposta incorreta\" style=\"display: flex; align-items: center; gap: 11px; border: 1px solid {{ borderIncorreta }}; background: {{ bgIncorreta }}; border-radius: 9px; padding: 11px 13px; cursor: pointer;\">\n                <div style=\"width: 18px; height: 18px; border-radius: 50%; border: 2px solid {{ dotIncorreta }}; display: flex; align-items: center; justify-content: center;\"><sc-if value=\"{{ selIncorreta }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"width: 9px; height: 9px; border-radius: 50%; background: #5b5fc7;\"><\u002Fdiv><\u002Fsc-if><\u002Fdiv>\n                <div><div style=\"font-size: 13.5px; font-weight: 600;\">Resposta incorreta<\u002Fdiv><div style=\"font-size: 11.5px; color: #8a8a94;\">O conteúdo não corresponde ao documento<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n\n              <div onclick=\"{{ pickType }}\" data-value=\"Desatualizada\" style=\"display: flex; align-items: center; gap: 11px; border: 1px solid {{ borderDesat }}; background: {{ bgDesat }}; border-radius: 9px; padding: 11px 13px; cursor: pointer;\">\n                <div style=\"width: 18px; height: 18px; border-radius: 50%; border: 2px solid {{ dotDesat }}; display: flex; align-items: center; justify-content: center;\"><sc-if value=\"{{ selDesat }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"width: 9px; height: 9px; border-radius: 50%; background: #5b5fc7;\"><\u002Fdiv><\u002Fsc-if><\u002Fdiv>\n                <div><div style=\"font-size: 13.5px; font-weight: 600;\">Desatualizada<\u002Fdiv><div style=\"font-size: 11.5px; color: #8a8a94;\">Existe versão mais recente do documento<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n\n              <div onclick=\"{{ pickType }}\" data-value=\"Incompleta\" style=\"display: flex; align-items: center; gap: 11px; border: 1px solid {{ borderIncompleta }}; background: {{ bgIncompleta }}; border-radius: 9px; padding: 11px 13px; cursor: pointer;\">\n                <div style=\"width: 18px; height: 18px; border-radius: 50%; border: 2px solid {{ dotIncompleta }}; display: flex; align-items: center; justify-content: center;\"><sc-if value=\"{{ selIncompleta }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"width: 9px; height: 9px; border-radius: 50%; background: #5b5fc7;\"><\u002Fdiv><\u002Fsc-if><\u002Fdiv>\n                <div><div style=\"font-size: 13.5px; font-weight: 600;\">Incompleta<\u002Fdiv><div style=\"font-size: 11.5px; color: #8a8a94;\">Faltam informações relevantes na resposta<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n\n              <div onclick=\"{{ pickType }}\" data-value=\"Fonte errada\" style=\"display: flex; align-items: center; gap: 11px; border: 1px solid {{ borderFonte }}; background: {{ bgFonte }}; border-radius: 9px; padding: 11px 13px; cursor: pointer;\">\n                <div style=\"width: 18px; height: 18px; border-radius: 50%; border: 2px solid {{ dotFonte }}; display: flex; align-items: center; justify-content: center;\"><sc-if value=\"{{ selFonte }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"width: 9px; height: 9px; border-radius: 50%; background: #5b5fc7;\"><\u002Fdiv><\u002Fsc-if><\u002Fdiv>\n                <div><div style=\"font-size: 13.5px; font-weight: 600;\">Fonte errada<\u002Fdiv><div style=\"font-size: 11.5px; color: #8a8a94;\">A citação aponta para o documento incorreto<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <textarea placeholder=\"Detalhes (opcional)\" style=\"width: 100%; margin-top: 12px; border: 1px solid #d6d5e0; border-radius: 9px; padding: 10px 12px; font-size: 13px; font-family: inherit; resize: none; height: 64px; color: #242424;\"><\u002Ftextarea>\n          <\u002Fdiv>\n          <div style=\"padding: 0 22px 20px; display: flex; justify-content: flex-end; gap: 10px; align-items: center;\">\n            <button onclick=\"{{ closeReport }}\" style=\"border: 1px solid #d6d5e0; background: #fff; color: #242424; font-size: 13.5px; font-weight: 600; padding: 9px 18px; border-radius: 8px; cursor: pointer; font-family: inherit;\">Cancelar<\u002Fbutton>\n            <button onclick=\"{{ submitReport }}\" style=\"border: none; background: {{ submitBg }}; color: #fff; font-size: 13.5px; font-weight: 600; padding: 9px 20px; border-radius: 8px; cursor: {{ submitCursor }}; font-family: inherit;\">Enviar feedback<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ reportSubmitted }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding: 30px 26px 26px; text-align: center;\">\n          <div style=\"width: 54px; height: 54px; border-radius: 50%; background: #e7f5ec; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center;\"><svg viewBox=\"0 0 24 24\" width=\"26\" height=\"26\"><path d=\"M5 13 L10 18 L20 6\" fill=\"none\" stroke=\"#1a7a43\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <div style=\"font-size: 17px; font-weight: 700; margin-bottom: 6px;\">Feedback registrado<\u002Fdiv>\n          <div style=\"font-size: 13px; color: #616168; line-height: 1.55; margin-bottom: 16px;\">Enviado à fila de revisão da curadoria. Ficará disponível para o responsável em até 5 minutos.<\u002Fdiv>\n          <div style=\"text-align: left; background: #f7f7f9; border: 1px solid #ebebef; border-radius: 10px; padding: 13px 15px; font-size: 12.5px; color: #4a4a54; display: flex; flex-direction: column; gap: 7px;\">\n            <div style=\"display: flex; justify-content: space-between;\"><span style=\"color: #8a8a94;\">Registro<\u002Fspan><span style=\"font-weight: 600;\">#FB-3092<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; justify-content: space-between;\"><span style=\"color: #8a8a94;\">Query original<\u002Fspan><span style=\"font-weight: 600;\">#Q-2481<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; justify-content: space-between;\"><span style=\"color: #8a8a94;\">Tipo<\u002Fspan><span style=\"font-weight: 600;\">{{ reportTypeLabel }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; justify-content: space-between;\"><span style=\"color: #8a8a94;\">Atendente<\u002Fspan><span style=\"font-weight: 600;\">Ana Ribeiro<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; justify-content: space-between;\"><span style=\"color: #8a8a94;\">Chunks vinculados<\u002Fspan><span style=\"font-weight: 600;\">3<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <button onclick=\"{{ closeReport }}\" style=\"margin-top: 18px; border: none; background: #5b5fc7; color: #fff; font-size: 13.5px; font-weight: 600; padding: 10px 22px; border-radius: 8px; cursor: pointer; font-family: inherit; width: 100%;\">Fechar<\u002Fbutton>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { reportOpen: false, reportQuery: '', reportType: '', reportSubmitted: false };\n\n  open(q) {\n    return () => this.setState({ reportOpen: true, reportQuery: q, reportType: '', reportSubmitted: false });\n  }\n\n  renderVals() {\n    const t = this.state.reportType;\n    const sel = (v) => t === v;\n    const selBorder = (v) => t === v ? '#5b5fc7' : '#e2e2e8';\n    const selBg = (v) => t === v ? '#f2f2fc' : '#fff';\n    const selDot = (v) => t === v ? '#5b5fc7' : '#c3c3cc';\n    const hasType = t !== '';\n\n    return {\n      reportOpen: this.state.reportOpen,\n      reportSubmitted: this.state.reportSubmitted,\n      reportNotSubmitted: !this.state.reportSubmitted,\n      reportQuery: this.state.reportQuery,\n      reportTypeLabel: t || 'Não especificado',\n\n      selIncorreta: sel('Resposta incorreta'),\n      selDesat: sel('Desatualizada'),\n      selIncompleta: sel('Incompleta'),\n      selFonte: sel('Fonte errada'),\n\n      borderIncorreta: selBorder('Resposta incorreta'), bgIncorreta: selBg('Resposta incorreta'), dotIncorreta: selDot('Resposta incorreta'),\n      borderDesat: selBorder('Desatualizada'), bgDesat: selBg('Desatualizada'), dotDesat: selDot('Desatualizada'),\n      borderIncompleta: selBorder('Incompleta'), bgIncompleta: selBg('Incompleta'), dotIncompleta: selDot('Incompleta'),\n      borderFonte: selBorder('Fonte errada'), bgFonte: selBg('Fonte errada'), dotFonte: selDot('Fonte errada'),\n\n      submitBg: hasType ? '#5b5fc7' : '#bfc0e3',\n      submitCursor: hasType ? 'pointer' : 'not-allowed',\n\n      pickType: (e) => this.setState({ reportType: e.currentTarget.getAttribute('data-value') }),\n      submitReport: () => { if (this.state.reportType) this.setState({ reportSubmitted: true }); },\n      closeReport: () => this.setState({ reportOpen: false }),\n\n      openReportA: this.open('Qual o prazo de devolução para um cliente Gold?'),\n      openReportB: this.open('Qual o multiplicador de frete para a região Norte?'),\n      openReportC: this.open('Qual o valor do seguro de carga?'),\n      openReportD: this.open('Posso cobrar frete pela devolução de pallets vazios?'),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
